<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 960 600">
  <title id="title">Trusted devices preview</title>
  <desc id="desc">Relaywright admin view showing trusted SMTP source IP and CIDR rules with policy summaries.</desc>
  <rect width="960" height="600" fill="#f8fbfc"/>
  <rect x="24" y="24" width="912" height="552" rx="10" fill="#ffffff" stroke="#d9e2e5"/>
  <rect x="24" y="24" width="912" height="64" rx="10" fill="#182028"/>
  <text x="56" y="65" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Relaywright</text>
  <text x="764" y="63" fill="#9fd6dd" font-family="Segoe UI, Arial, sans-serif" font-size="16">Settings / Trusted networks</text>
  <rect x="56" y="122" width="560" height="40" rx="6" fill="#eef5fb" stroke="#d9e2e5"/>
  <text x="74" y="148" fill="#283038" font-family="Segoe UI, Arial, sans-serif" font-size="16">Search source, owner, location, or sender policy</text>
  <rect x="748" y="120" width="148" height="44" rx="7" fill="#088090"/>
  <text x="775" y="148" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Add network</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="56" y="196" width="840" height="46" rx="6" fill="#e6f6f8"/>
    <text x="76" y="225" fill="#283038" font-size="14" font-weight="700">Source</text>
    <text x="224" y="225" fill="#283038" font-size="14" font-weight="700">Owner</text>
    <text x="366" y="225" fill="#283038" font-size="14" font-weight="700">Sender policy</text>
    <text x="586" y="225" fill="#283038" font-size="14" font-weight="700">Recipients</text>
    <text x="746" y="225" fill="#283038" font-size="14" font-weight="700">Rate</text>
    <g fill="#283038" font-size="15">
      <rect x="56" y="252" width="840" height="58" fill="#ffffff" stroke="#d9e2e5"/>
      <text x="76" y="286">192.168.12.25</text>
      <text x="224" y="286">Reception printer</text>
      <text x="366" y="286">printer@office.local</text>
      <text x="586" y="286">operations</text>
      <text x="746" y="286">120/hour</text>
      <rect x="56" y="320" width="840" height="58" fill="#ffffff" stroke="#d9e2e5"/>
      <text x="76" y="354">10.40.8.0/24</text>
      <text x="224" y="354">Warehouse scanners</text>
      <text x="366" y="354">scanner-* allowed</text>
      <text x="586" y="354">shipping</text>
      <text x="746" y="354">480/hour</text>
      <rect x="56" y="388" width="840" height="58" fill="#ffffff" stroke="#d9e2e5"/>
      <text x="76" y="422">172.20.4.18</text>
      <text x="224" y="422">ERP batch host</text>
      <text x="366" y="422">erp-alerts@example</text>
      <text x="586" y="422">finance</text>
      <text x="746" y="422">60/hour</text>
    </g>
  </g>
  <rect x="56" y="486" width="270" height="44" rx="7" fill="#e8f6ee"/>
  <text x="76" y="514" fill="#1f8a5b" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">3 trusted sources active</text>
  <rect x="344" y="486" width="320" height="44" rx="7" fill="#fff6df"/>
  <text x="364" y="514" fill="#866000" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">Policy preview available before DATA</text>
</svg>
