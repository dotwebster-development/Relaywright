<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 960 600">
  <title id="title">Backups and security preview</title>
  <desc id="desc">Relaywright operations view showing backup restore readiness and admin security status.</desc>
  <rect width="960" height="600" fill="#f8fbfc"/>
  <rect x="24" y="24" width="912" height="552" rx="10" fill="#ffffff" stroke="#d9e2e5"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="56" y="78" fill="#182028" font-size="28" font-weight="700">System operations</text>
    <text x="56" y="112" fill="#68757d" font-size="16">Backup readiness, certificate status, and admin sign-in history.</text>
    <rect x="56" y="154" width="404" height="348" rx="8" fill="#ffffff" stroke="#d9e2e5"/>
    <rect x="56" y="154" width="404" height="54" rx="8" fill="#e8f6ee"/>
    <text x="80" y="189" fill="#1f8a5b" font-size="20" font-weight="700">Backups ready</text>
    <text x="80" y="246" fill="#283038" font-size="16" font-weight="700">Latest validated backup</text>
    <text x="80" y="276" fill="#68757d" font-size="15">relaywright-2026-07-06-1800.zip</text>
    <rect x="80" y="308" width="340" height="44" rx="6" fill="#f8fbfc" stroke="#d9e2e5"/>
    <text x="100" y="336" fill="#283038" font-size="15">Restore staging: clean</text>
    <rect x="80" y="368" width="340" height="44" rx="6" fill="#f8fbfc" stroke="#d9e2e5"/>
    <text x="100" y="396" fill="#283038" font-size="15">Retention: 14 days</text>
    <rect x="80" y="428" width="166" height="38" rx="19" fill="#088090"/>
    <text x="116" y="453" fill="#ffffff" font-size="15" font-weight="700">Download</text>
    <rect x="500" y="154" width="404" height="348" rx="8" fill="#ffffff" stroke="#d9e2e5"/>
    <rect x="500" y="154" width="404" height="54" rx="8" fill="#eef5fb"/>
    <text x="524" y="189" fill="#182028" font-size="20" font-weight="700">Security posture</text>
    <rect x="524" y="236" width="336" height="44" rx="6" fill="#e8f6ee"/>
    <text x="546" y="264" fill="#1f8a5b" font-size="15" font-weight="700">HTTPS certificate active</text>
    <rect x="524" y="302" width="336" height="44" rx="6" fill="#e6f6f8"/>
    <text x="546" y="330" fill="#088090" font-size="15" font-weight="700">Admin HTTP disabled</text>
    <rect x="524" y="368" width="336" height="44" rx="6" fill="#fff6df"/>
    <text x="546" y="396" fill="#866000" font-size="15" font-weight="700">Suspicious login warnings: 0</text>
    <text x="524" y="452" fill="#68757d" font-size="14">Recent admin session</text>
    <text x="524" y="478" fill="#283038" font-size="15">websterxsd from 192.168.1.10</text>
  </g>
</svg>
